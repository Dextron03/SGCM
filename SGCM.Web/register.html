<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Crear cuenta</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Crear cuenta</h1>
        <p id="feedback" hidden></p>
        <form id="register-form">
          <label for="fullName">Nombre completo</label>
          <input type="text" id="fullName" name="fullName" required autocomplete="name" />

          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required autocomplete="email" />

          <label for="phoneNumber">Teléfono</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" required autocomplete="tel" />

          <label for="role">Tipo de cuenta</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Seleccioná una opción</option>
            <option value="Patient">Paciente</option>
            <option value="Doctor">Médico</option>
          </select>

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" />

          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" />

          <button type="submit">Registrarme</button>
        </form>
        <p class="switch-link">¿Ya tenés cuenta? <a href="/index.html">Iniciá sesión</a></p>
      </div>
    </div>
    <script type="module" src="/src/register.js"></script>
  </body>
</html>
