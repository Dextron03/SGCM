<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Crear cuenta</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="eyebrow">SGCM</p><h1>Crea tu cuenta</h1><p class="lead">Completa tus datos. Te enviaremos un correo para confirmar tu cuenta.</p>
        <p id="feedback" role="status" aria-live="polite" hidden></p>
        <form id="register-form">
          <div class="field"><label for="fullName">Nombre completo</label><input type="text" id="fullName" name="fullName" placeholder="Ej.: Ana Pérez" required autocomplete="name" /></div>

          <div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email" /></div>

          <div class="field"><label for="phoneNumber">Teléfono</label><input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Ej.: 809-555-0100" required autocomplete="tel" /></div>

          <div class="field"><label for="role">Tipo de cuenta</label><select id="role" name="role" required>
            <option value="" disabled selected>Seleccioná una opción</option>
            <option value="Patient">Paciente</option>
            <option value="Doctor">Médico</option>
          </select><p class="helper-text">Selecciona el perfil con el que usarás la plataforma.</p></div>

          <div class="field"><label for="password">Contraseña</label><input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" /></div>

          <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required autocomplete="new-password" /></div>

          <button type="submit">Registrarme</button>
        </form>
        <p class="switch-link">¿Ya tienes cuenta? <a href="/index.html">Inicia sesión</a></p>
      </div>
    </div>
    <script type="module" src="/src/register.js"></script>
  </body>
</html>
