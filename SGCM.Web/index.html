<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Iniciar sesión</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="eyebrow">SGCM</p><h1>Bienvenido de nuevo</h1><p class="lead">Ingresa tus datos para acceder a tu cuenta.</p>
        <p id="error" class="error" role="alert" aria-live="assertive" hidden></p>
        <form id="login-form">
          <div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email" /></div>

          <div class="field"><label for="password">Contraseña</label><input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password" /></div>

          <button type="submit">Entrar</button>
        </form>
        <p class="switch-link">¿No tienes cuenta? <a href="/register.html">Crea una cuenta</a></p>
      </div>
    </div>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
