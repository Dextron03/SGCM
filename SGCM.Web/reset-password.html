<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Restablecer contraseña</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="eyebrow">SGCM</p><h1>Restablecer contraseña</h1><p class="lead">Elige una nueva contraseña para tu cuenta.</p>
        <p id="feedback" role="status" aria-live="polite" hidden></p>
        <form id="reset-password-form">
          <div class="field"><label for="newPassword">Nueva contraseña</label><input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" /></div>

          <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required autocomplete="new-password" /></div>

          <button type="submit">Restablecer contraseña</button>
        </form>
        <p class="switch-link"><a href="/index.html">Volver a iniciar sesión</a></p>
      </div>
    </div>
    <script type="module" src="/src/reset-password.js"></script>
  </body>
</html>
