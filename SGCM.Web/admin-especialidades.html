<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar especialidades | SGCM</title>

    <link rel="stylesheet" href="/src/style.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f4f7fb;
            --surface: #ffffff;
            --text: #172033;
            --muted: #667085;
            --border: #e4e7ec;
            --danger: #b42318;
            --danger-dark: #912018;
            --danger-bg: #fef3f2;
            --success: #027a48;
            --success-bg: #ecfdf3;
        }

        body {
            display: block;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            color: var(--primary);
            font-size: 1.35rem;
            font-weight: bold;
        }

        .topbar a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }

        .admin-container {
            width: min(1100px, calc(100% - 32px));
            margin: 38px auto;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            text-align: left;
        }

        .page-header p {
            color: var(--muted);
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 14px 16px;
            border-radius: 10px;
        }

        .message.visible {
            display: block;
        }

        .message.success {
            color: var(--success);
            background: var(--success-bg);
        }

        .message.error {
            color: var(--danger);
            background: var(--danger-bg);
        }

        .admin-grid {
            display: grid;
            grid-template-columns:
                minmax(280px, 0.8fr)
                minmax(0, 1.5fr);
            gap: 22px;
            align-items: start;
        }

        .panel {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(16, 24, 40, 0.05);
        }

        .panel h2 {
            margin: 0 0 20px;
            font-size: 1.2rem;
        }

        label {
            margin-bottom: 7px;
            color: #344054;
            font-size: 0.92rem;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 16px;
            padding: 11px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            color: var(--text);
            font: inherit;
        }

        textarea {
            min-height: 115px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
            outline: 3px solid rgba(37, 99, 235, 0.14);
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .form-actions button {
            flex: 1;
            width: auto;
        }

        .secondary-button {
            color: #344054;
            background: #eef2f7;
        }

        .secondary-button:hover {
            background: #e4e7ec;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        td {
            overflow-wrap: anywhere;
        }

        .row-actions {
            display: flex;
            gap: 8px;
        }

        .row-actions button {
            width: auto;
            padding: 8px 11px;
            font-size: 0.86rem;
        }

        .edit-button {
            background: #475467;
        }

        .edit-button:hover {
            background: #344054;
        }

        .delete-button {
            background: var(--danger);
        }

        .delete-button:hover {
            background: var(--danger-dark);
        }

        .empty-state {
            padding: 28px 12px;
            color: var(--muted);
            text-align: center;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        @media (max-width: 820px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body data-page="specialties-admin">
    <header class="topbar">
        <span class="brand">SGCM</span>
        <a href="/index.html">Inicio</a>
    </header>

    <main class="admin-container">
        <header class="page-header">
            <h1>Administrar especialidades</h1>

            <p>
                Crea, actualiza y organiza las especialidades
                médicas disponibles.
            </p>
        </header>

        <div
            id="specialty-message"
            class="message"
            role="status"
            aria-live="polite">
        </div>

        <div class="admin-grid">
            <section class="panel">
                <h2 id="form-title">
                    Nueva especialidad
                </h2>

                <form id="specialty-form">
                    <input
                        type="hidden"
                        id="specialty-id">

                    <label for="specialty-name">
                        Nombre
                    </label>

                    <input
                        id="specialty-name"
                        name="name"
                        type="text"
                        maxlength="100"
                        required
                        autocomplete="off">

                    <label for="specialty-description">
                        Descripción
                    </label>

                    <textarea
                        id="specialty-description"
                        name="description"
                        maxlength="500"></textarea>

                    <div class="form-actions">
                        <button
                            id="save-specialty"
                            type="submit">
                            Guardar
                        </button>

                        <button
                            id="cancel-edit"
                            class="secondary-button"
                            type="button"
                            hidden>
                            Cancelar
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <h2>Especialidades registradas</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="specialties-body">
                            <tr>
                                <td
                                    class="empty-state"
                                    colspan="3">
                                    Cargando especialidades...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script
        type="module"
        src="/src/especialidades.js">
    </script>
</body>
</html>
