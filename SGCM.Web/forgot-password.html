<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Recuperar contraseña</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="eyebrow">SGCM</p><h1>Recuperar contraseña</h1><p class="lead">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        <p id="feedback" role="status" aria-live="polite" hidden></p>
        <form id="forgot-password-form">
          <div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email" /></div>

          <button type="submit">Enviar enlace de recuperación</button>
        </form>
        <p class="switch-link"><a href="/index.html">Volver a iniciar sesión</a></p>
      </div>
    </div>
    <script type="module" src="/src/forgot-password.js"></script>
  </body>
</html>
